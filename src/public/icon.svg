<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="34" y1="42" x2="94" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="eyeGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="128" height="128" rx="30" fill="url(#bgGrad)"/>
  <rect x="3" y="3" width="122" height="122" rx="27" stroke="url(#ringGrad)" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Outer Signal / Orbit Arcs -->
  <path d="M22 44C28 26 44 15 64 15C84 15 100 26 106 44" stroke="url(#ringGrad)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.55" stroke-dasharray="4 6"/>
  <path d="M30 98C39 107 51 112 64 112C77 112 89 107 98 98" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.4"/>

  <!-- Side Transceiver Pods -->
  <rect x="20" y="53" width="8" height="24" rx="4" fill="url(#ringGrad)"/>
  <rect x="100" y="53" width="8" height="24" rx="4" fill="url(#ringGrad)"/>

  <!-- Main Agent Head Shell -->
  <rect x="30" y="34" width="68" height="60" rx="22" fill="#131C31" stroke="url(#ringGrad)" stroke-width="3.5"/>

  <!-- Top Telemetry Node -->
  <path d="M64 22V34" stroke="url(#ringGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="64" cy="19" r="5" fill="#38BDF8"/>
  <circle cx="64" cy="19" r="8" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Inner Glass Visor -->
  <rect x="38" y="44" width="52" height="32" rx="13" fill="url(#visorGrad)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Glowing Optical Sensors -->
  <rect x="47" y="53" width="10" height="14" rx="5" fill="url(#eyeGlow)"/>
  <rect x="71" y="53" width="10" height="14" rx="5" fill="url(#eyeGlow)"/>
  <circle cx="50" cy="57" r="2" fill="#E0F2FE"/>
  <circle cx="74" cy="57" r="2" fill="#E0F2FE"/>

  <!-- Voice / Stream Pulse Bar -->
  <path d="M52 84H76" stroke="url(#ringGrad)" stroke-width="4" stroke-linecap="round"/>
</svg>
